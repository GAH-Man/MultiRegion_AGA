          TopicName: !Join ["", [!Ref AppName, !Ref Environment,  "_QA_IdP_AutoScalingEvent4443_", !Ref Region]]
          

    ######################################################################################################
    ######################################################################################################
    #  DEV IdP LaunchConfiguration https (4444)
    ShibbolethDEVIdPLaunchTemplate4444:
        Type: AWS::EC2::LaunchTemplate
        DeletionPolicy: 'Delete'
        Condition: CreateShibbolethDEVIdPResources4444
        Properties:
            #LaunchTemplateName is not required
            LaunchTemplateName:  !Join ['', [!Ref AppName, !Ref Environment,  "-DEVIdP-LaunchTemplate4444-", !Ref Region ]]
            LaunchTemplateData:
                BlockDeviceMappings:
                    - DeviceName: !Ref BlockDeviceName
                      Ebs:
                          Encrypted: true
                          KmsKeyId: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, EBSKEYIDVA ], !FindInMap [Environments, !Ref Environment, EBSKEYIDOH ] ]
                          VolumeSize: !Ref ShibbolethIdPEbsSize
                IamInstanceProfile:
                    #Name: !Ref S3Role
                    Name:  !FindInMap [Environments, !Ref Environment, EC2InstanceProfile]
                #XXXXXImageId: !FindInMap [Environments, !Ref Environment, DEVAMIID]
                ImageId: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment,DEVAMIIDVA ], !FindInMap [Environments, !Ref Environment, DEVAMIIDOH ] ]
                InstanceType: !FindInMap [Environments, !Ref Environment, EC2InstanceType]
                #KeyName: !Ref WHAMIKey
                SecurityGroupIds:
                    #  Apply Security Groups to the Launch Template
                    #######  ImportValue #######
                    - Fn::ImportValue: !Join ['', [!Ref AppName, !Ref Environment,  "-APPSGxID"] ]
                    -  Fn::ImportValue: !Join ['', [!Ref AppName, !Ref Environment, "-STDBASESGxID"]]     
                    #######  MapValue #######
                    #- !FindInMap [Environments, !Ref Environment, STDBASESGxID]

    #  ShibbolethIdP AutoScaling Group https (4444)
    ShibbolethDEVIdPASG4444:
        Type: AWS::AutoScaling::AutoScalingGroup
        DeletionPolicy: 'Delete'
        Condition: CreateShibbolethDEVIdPResources4444
        Properties:
            AutoScalingGroupName: !Join ["", [!Ref AppName, !Ref Environment,  "-DEVIdP-ASG4444-", !Ref Region ]]
            AvailabilityZones:
                #######  ImportValue AZs ######
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-AZ1"]]
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment,  "-AZ2"]]
            VPCZoneIdentifier:
                #######  ImportValue Subnets #######
                #- Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PublicSubnet1"]]
                #- Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment,  "-PublicSubnet2"]]
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PrivateSubnet1"]]
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PrivateSubnet2"]]
            ######  LaunchTemplate to use  ######
            LaunchTemplate: 
                LaunchTemplateId: !Ref ShibbolethDEVIdPLaunchTemplate4444
                Version: !GetAtt ShibbolethDEVIdPLaunchTemplate4444.LatestVersionNumber
            TargetGroupARNs:
                #######  ImportValue TargetGroup #######
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-DEVIdP-TG4444"] ]
            #DesiredCapacity: !FindInMap [Environments, !Ref Environment, DEVASGMin]
            #MinSize: !FindInMap [Environments, !Ref Environment, DEVASGMin]
            DesiredCapacity: 0
            MinSize: 0
            #MaxSize: !FindInMap [Environments, !Ref Environment, DEVASGMax]
            MaxSize:  !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, DEVASGMaxVA ], !FindInMap [Environments, !Ref Environment, DEVASGMaxOH ] ]
            Cooldown: !Ref ShibbolethIdPCoolDownPeroid
            HealthCheckType: !Ref ShibbolethIdPHealthCheck
            HealthCheckGracePeriod: !Ref ShibbolethIdPHealthCheckWaitPeroid
            ServiceLinkedRoleARN:  !FindInMap [Environments, !Ref Environment, AutoScalingRoleArn]
            NotificationConfigurations:
                - TopicARN:
                      Ref: ShibbolethDEVIdPASGTopic4444
                  NotificationTypes:
                      - autoscaling:EC2_INSTANCE_LAUNCH
                      - autoscaling:EC2_INSTANCE_LAUNCH_ERROR
                      - autoscaling:EC2_INSTANCE_TERMINATE
                      - autoscaling:EC2_INSTANCE_TERMINATE_ERROR
            Tags:
                - Key: Name
                  Value:  !Join ["", [!Ref AppName, !Ref Environment,  "-DEVIdP-ASG4444"]]
                  PropagateAtLaunch: "true"
                - Key: SupportContactEmail
                  Value: !Ref SupportContactEmail
                  PropagateAtLaunch: "true"
                - Key: SupportGroup
                  Value: !Ref SupportGroup
                  PropagateAtLaunch: "true"
                - Key: srd:profile
                  Value: !Join ['', ['cimp:', !Ref AppName]]
                  PropagateAtLaunch: "true"
                - Key: EmorySpeedType1:SpeedTypePercent1
                  Value: !Join ['', [!Ref SPEEDTYPE, ':100']]  
                  PropagateAtLaunch: "true"
                - Key: EmoryApplicationName
                  Value: !Ref AppName
                  PropagateAtLaunch: "true"
                - Key: EmoryApplicationNameType
                  Value: !Ref AppName
                  PropagateAtLaunch: "true"

    #  ShibbolethIdP 4444 AutoScaling Policy
    ShibbolethDEVIdPCPUPolicy4444:
        Type: AWS::AutoScaling::ScalingPolicy
        DeletionPolicy: 'Delete'
        Condition: CreateShibbolethDEVIdPResources4444
        Properties:
            ##### AutoScalingGroup
            AutoScalingGroupName: !Ref ShibbolethDEVIdPASG4444
            PolicyType: TargetTrackingScaling
            TargetTrackingConfiguration:
                PredefinedMetricSpecification:
                    PredefinedMetricType: ASGAverageCPUUtilization
                TargetValue: !Ref ShibbolethIdPCpuTargetValue      

    #  Create SNS Topic ShibbolethIdPASG 4444
    ShibbolethDEVIdPASGTopic4444:
      Type: AWS::SNS::Topic
      DeletionPolicy: 'Delete'
      Condition: CreateShibbolethDEVIdPResources4444
      Properties:
          Subscription:
              #- Endpoint: !Ref SNSEmail
              - Endpoint: !FindInMap [Environments, !Ref Environment, SNSEmail]
                Protocol: "email"
          TopicName: !Join ["", [!Ref AppName, !Ref Environment,  "_DEV_IdP_AutoScalingEvent4444_", !Ref Region]]
          


