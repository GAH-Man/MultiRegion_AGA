                - Key: SupportContactEmail
                  Value: !Ref SupportContactEmail
                  PropagateAtLaunch: "true"
                - Key: SupportGroup
                  Value: !Ref SupportGroup
                  PropagateAtLaunch: "true"
                - Key: srd:profile
                  Value: !Join ['', ['cimp:', !Ref AppName]]
                  PropagateAtLaunch: "true"
                - Key: EmorySpeedType1:SpeedTypePercent1
