---
AWSTemplateFormatVersion: 2010-09-09
Description:  Creates the LaunchTemplates and AutoScalingGroups for the DEV, the QA, and the PROD IdPs.
              Exports the LaunchTemplate and AutoScalingGroup names.
              No NLB for the DEV or QA Environments.

Parameters:
    AppName: 
        Description: The application name.
        Type: String
        Default: WebMgmtShibIdP
        AllowedValues:
            - WebMgmtShibIdP

    Environment:
        Description: Environment. Determines which environment and resources will be built.
        Type: String
        Default: TEST
        AllowedValues:
            - PROD
            - QA
            - DEV
            - TEST
        ConstraintDescription: Must specify Prod, PROD, Qa, QA, Dev, DEV, Test or TEST.

    CreateShibbolethPRODIdPEnvironment:
        Type: String
        Default: 'yes'
        AllowedValues:
            - 'yes'
            - 'no'
        Description: Determines whether to create the Coldfusion resources.

    CreateShibbolethQAIdPEnvironment4443:
        Type: String
        Default: 'yes'
        AllowedValues:
            - 'yes'
            - 'no'
        Description: Determines whether to create the Coldfusion resources.

    CreateShibbolethDEVIdPEnvironment4444:
        Type: String
        Default: 'yes'
        AllowedValues:
            - 'yes'
            - 'no'
        Description: Determines whether to create the Coldfusion resources.

    SNSEmail:
        Type: String
        Default: 'ghall4@emory.edu'
        AllowedValues:
            - 'ghall4@emory.edu'
            - 'webgroup@emory.edu'
        Description: Support contact email.

    SupportContactEmail:
        Type: String
        Default: 'webgroup@emory.edu'
        Description: Support contact email.

    SupportGroup:
        Type: String
        Default: 'Emory University WebManagement'
        Description: Support Group for this service.

    ###################################################################################################################
    ########  COMMON   ################################################################################################
    ###################################################################################################################
    BlockDeviceName:
        Type: String
        #Default: '/dev/xvda'
        Default: '/dev/sda1'
        Description:  Root device name.

    EbsSize:
        Type: Number
        Default: 25
        Description: EBS volume size.

    EmoryWildCardCert:
        Type: String
        Default: 'arn:aws:acm:us-east-1:181123324664:certificate/e2eb062a-ee94-4e2a-909f-7fabb2510cd6'
        AllowedValues:
            - 'arn:aws:acm:us-east-1:181123324664:certificate/e2eb062a-ee94-4e2a-909f-7fabb2510cd6'
        Description:  Must be a a valid cert ARN's.  AWS hard-limit of 25 per ALB.

    HttpsListenerPolicy:
        Type: String
        #  policy for only TLS version 1.2 and higher
        Default:  'ELBSecurityPolicy-TLS-1-2-2017-01'

    Region:
        Description: Region- Change to VA or OH.
        Default: 'VA'
        Type: String
        AllowedValues:
            - 'VA'
            - 'OH'
        ConstraintDescription: AWS Region - Change to VA or OH.

    S3Role:
        Type:  String
        Default: 'EC2-Full_Access_S3'

    ShibbolethIdPCpuTargetValue:
        Type: Number
        Default: 80
        Description:  CPU useage at which scaling-out will occur.

    ShibbolethIdPInstanceTypeParameter:
        Type: String
        Default: 't3a.large'
        AllowedValues:
            - 't3a.small'
            - 't3a.medium'
            - 't3a.large'
            - 't3a.xlarge'
        Description: Default is t3a.large.

    ShibbolethIdPEbsSize:
        Type: Number
        Default: 100
        Description: Root device size. EBS size must be >= the size of the source AMI volume size.

    ShibbolethIdPEC2Desired:
        Type: Number
        Default:  1
        Description:  The number of Amazon EC2 instances that the Auto Scaling group attempts to maintain.

    ShibbolethIdPEC2Max:
        Type: Number
        Default:  2
        Description:  Maximum number of EC2's for auto-scaling to have at any given time.

    ShibbolethIdPEC2Min:
        Type: Number
        Default:  1
        Description:  Minimum number of EC2's for auto-scaling to maintain at all times.

    ShibbolethIdPHealthCheck:
        Type: String
        Default: ELB
        AllowedValues:
            - ELB
            - EC2
        Description: ELB checks consider the instance unhealthy if it fails either the EC2 status checks or the load balancer health checks.

    ShibbolethIdPHealthCheckWaitPeroid:
        Type: Number
        #Default: 90
        Default: 180
        Description: The amount of time (seconds) AutoScaling waits before checking the health status of an EC2 instance that has come into service.

    ShibbolethIdPHealthCheckInterval:
        Type: Number
        Default: 20
        Description: The approximate interval, in seconds, between health checks of an individual instances.

    ShibbolethIdPCoolDownPeroid:
        Type: Number
        Default: 120
        Description: The amount of time, in seconds, after a scaling activity completes before another scaling activity can start.

    SPEEDTYPE:
        Type: String
        Default: "1233430000"
        Description: Emory SpeedType - should be set by Jenkins
        
##############################################################################################################
################  Mappings and Conditions  ###################################################################
##############################################################################################################
###  SEE:  https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/conditions-section-structure.html ##
##############################################################################################################
Mappings:
    ##### REM: Parameter names must be same in all 3 Environment Maps.
    ##### REM:  Only SGx security groups in QA and PROD Environments.
    Environments:
        #################################################
        #####  PROD Environment/AWS Account
        #################################################
        PROD:
            ### SNSEmail
            SNSEmail: webgroup@emory.edu
            ### Instance Type
            EC2InstanceType: t2.large
            ### IAM Instance Profile
            EC2InstanceProfile: WebMgmtShibIdP-Prod-EC2Role
            ### IAM Roles
            ### AutoScaling Role
            AutoScalingRole:  AWSServiceRoleForAutoScaling_WebMgmtShibIdPProd
            AutoScalingRoleArn: arn:aws:iam::XXXXXX:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling_WebMgmtShibIdPProd
            ### CloudWatch Role
            CloudWatchAgentRole: WebMgmtShibIdPProdEC2CloudWatchAgentRole
            CloudWatchAgentRoleArn: arn:aws:iam::XXXXX:role/WebMgmtShibIdPProdEC2CloudWatchAgentRole
            EC2InstanceProfile: WebMgmtShibIdP-Prod-EC2Role
            ##### KMS Keys
            ### EBS
            # VA
            EBSKEYALIASVA: WebMgmtShibIdPPROD-EBS-Key
            EBSKEYARNVA:  arn:aws:kms:us-east-1:xxxxx
            EBSKEYIDVA: xxxxx
            # OH
            EBSKEYALIASOH: WebMgmtShibIdPPROD-EBS-Key
            EBSKEYARNOH:  arn:aws:kms:us-east-2:xxxxx
            EBSKEYIDOH: xxxxx
            ### PROD Environment AMI IDs
            ### AMIs ######
            ### VA PROD ENV AMIs
            DEVAMIIDVA: xxxxx
            QAAMIIDVA: xxxxx
            PRODAMIIDVA: xxxxx
            ### OH PROD ENV AMIs
            DEVAMIIDOH: xxxxx
            QAAMIIDOH: xxxxx
            PRODAMIIDOH: xxxxx
            ##### ASG min, Max, Desired
            ### VA DEV ASG
            DEVASGMinVA: 1
            DEVASGMaxVA: 1
            DEVASGDesiredVA: 1
            ### VA QA ASG
            QAASGMinVA: 1
            QAASGMaxVA: 1
            QAASGDesiredVA: 1
            ### VA PROD ASG
            PRODASGMinVA: 1
            PRODASGMaxVA: 1
            PRODASGDesiredVA: 1
            ### OH DEV ASG
            DEVASGMinOH: 1
            DEVASGMaxOH: 1
            DEVASGDesiredOH: 1
            ### OH QA ASG
            QAASGMinOH: 1
            QAASGMaxOH: 1
            QAASGDesiredOH: 1
            ### OH PROD ASG
            PRODASGMinOH: 1
            PRODASGMaxOH: 1
            PRODASGDesiredOH: 1

        #################################################
        #####  QA Environment/AWS Account
        #################################################
        QA:
            ### SNSEmail
            SNSEmail: webgroup@emory.edu
            ### Instance Type
            EC2InstanceType: t2.large
            ### IAM Instance Profile
            EC2InstanceProfile: WebMgmtShibIdP-QA-EC2Role
            ##### IAM Roles
            ### AutoScaling Role
            AutoScalingRole:  AWSServiceRoleForAutoScaling_WebMgmtShibIdPQA
            AutoScalingRoleArn: arn:aws:iam::177227696563:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling_WebMgmtShibIdPQA
            ### CloudWatch Role
            CloudWatchAgentRole: WebMgmtShibIdPQAEC2CloudWatchAgentRole
            CloudWatchAgentRoleArn: arn:aws:iam::177227696563:role/WebMgmtShibIdPQAEC2CloudWatchAgentRole
            ##### KMS Keys
            ### EBS
            # VA
            EBSKEYALIASVA: WebMgmtShibIdPQA-EBS-Key
            EBSKEYARNVA:  arn:aws:kms:us-east-1:177227696563:key/6d0aa908-d4bb-410c-b2d5-9814a1533b92
            EBSKEYIDVA: 6d0aa908-d4bb-410c-b2d5-9814a1533b92
            # OH
            EBSKEYALIASOH: WebMgmtShibIdPQA-EBS-Key
            EBSKEYARNOH:  arn:aws:kms:us-east-2:xxxxx
            EBSKEYIDOH: xxxxx
            ### QA Environment AMI IDs
            ### AMIs ######
            ### VA QA ENV AMIs
            DEVAMIIDVA: ami-00f3118c5ed9bfd5a
            QAAMIIDVA: ami-03076c02d16bd490a
            PRODAMIIDVA: ami-01aa83f3ed1fed3cf
            ### OH QA ENV AMIs
            DEVAMIIDOH: xxxxx
            QAAMIIDOH: xxxxx
            PRODAMIIDOH: xxxxx
            ##### ASG min, Max, Desired
            ### VA DEV ASG
            DEVASGMinVA: 1
            DEVASGMaxVA: 1
            DEVASGDesiredVA: 1
            ### VA QA ASG
            QAASGMinVA: 1
            QAASGMaxVA: 1
            QAASGDesiredVA: 1
            ### VA PROD ASG
            PRODASGMinVA: 1
            PRODASGMaxVA: 1
            PRODASGDesiredVA: 1
            ### OH DEV ASG
            DEVASGMinOH: 0
            DEVASGMaxOH: 0
            DEVASGDesiredOH: 0
            ### OH QA ASG
            QAASGMinOH: 0
            QAASGMaxOH: 0
            QAASGDesiredOH: 0
            ### OH PROD ASG
            PRODASGMinOH: 0
            PRODASGMaxOH: 0
            PRODASGDesiredOH: 0    
            
        #################################################
        #####  DEV Environment/AWS Account
        #################################################
        DEV:
            ### SNSEmail
            SNSEmail: webgroup@emory.edu
            ### Instance Type
            EC2InstanceType: t2.large
            ### IAM Instance Profile
            EC2InstanceProfile: WebMgmtShibIdP-Dev-EC2Role
            ### EBS
            # VA
            EBSKEYALIASVA: WebMgmtShibIdPDev-EBS-Key
            EBSKEYARNVA:  arn:aws:kms:us-east-1:637667300994:key/41e219cc-cffc-4358-a412-4d8b439e368c
            EBSKEYIDVA: 41e219cc-cffc-4358-a412-4d8b439e368c
            # OH
            EBSKEYALIASOH: WebMgmtShibIdPDev-EBS-Key
            EBSKEYARNOH:  arn:aws:kms:us-east-2:637667300994:key/ba39dd76-79a9-4cf6-87f8-8ee8ba1a7196
            EBSKEYIDOH: ba39dd76-79a9-4cf6-87f8-8ee8ba1a7196
            ##### IAM Roles
            ### AutoScaling Role
            AutoScalingRole:  AWSServiceRoleForAutoScaling_WebMgmtShibIdPDev
            AutoScalingRoleArn: arn:aws:iam::637667300994:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling_WebMgmtShibIdPDev
            ### CloudWatch Role
            CloudWatchAgentRole: WebMgmtShibIdPDevEC2CloudWatchAgentRole
            CloudWatchAgentRoleArn: arn:aws:iam::637667300994:role/WebMgmtShibIdPDevEC2CloudWatchAgentRole
            ### DEV Environment AMI IDs
            ### AMIs ######
            ### VA DEV ENV AMIs
            DEVAMIIDVA: ami-0bd1c734a578b8711
            QAAMIIDVA: ami-044b47879ba86ac26
            PRODAMIIDVA: ami-04c5ffd2d3bd6357b
            ### OH DEV ENV AMIs
            DEVAMIIDOH: ami-0569bea37934c2caf
            QAAMIIDOH: ami-059b6f5e467a25441
            PRODAMIIDOH: ami-0628e06ebf0b36900
            ##### ASG min, Max, Desired
            ### VA DEV ASG
            DEVASGMinVA: 1
            DEVASGMaxVA: 1
            DEVASGDesiredVA: 1
            ### VA QA ASG
            QAASGMinVA: 1
            QAASGMaxVA: 1
            QAASGDesiredVA: 1
            ### VA PROD ASG
            PRODASGMinVA: 1
            PRODASGMaxVA: 1
            PRODASGDesiredVA: 1
            ### OH DEV ASG
            DEVASGMinOH: 1
            DEVASGMaxOH: 1
            DEVASGDesiredOH: 1
            ### OH QA ASG
            QAASGMinOH: 1
            QAASGMaxOH: 1
            QAASGDesiredOH: 1
            ### OH PROD ASG
            PRODASGMinOH: 1
            PRODASGMaxOH: 1
            PRODASGDesiredOH: 1


Conditions:
    #  Conditionally determines which Environment (Prod, Qa, Dev, Test) to build.
    CreateProdResources: !Equals [ !Ref Environment, PROD ]
    CreateQaResources: !Equals [ !Ref Environment, QA ]
    CreateDevResources: !Equals [ !Ref Environment, DEV ]
    

    CreateShibbolethPRODIdPResources: !Equals [ !Ref CreateShibbolethPRODIdPEnvironment, 'yes' ]
    CreateShibbolethQAIdPResources4443: !Equals [ !Ref CreateShibbolethQAIdPEnvironment4443, 'yes' ]
    CreateShibbolethDEVIdPResources4444: !Equals [ !Ref CreateShibbolethDEVIdPEnvironment4444, 'yes' ]

    CreateVAResources: !Equals [ !Ref Region, 'VA' ]
    CreateOHResources: !Equals [ !Ref Region, 'OH']

##################################################################################################################
##### NOTE:
#####        From Mappings need EC2InstanceProfile, EC2InstanceType, AutoScalingRoleArn, SNSEmail, STDBASESGxID
#####                           PRODAMIID, PRODASGDesired, PRODASGMin, PRODASGMax,
#####                           QAAMIID, QAASGDesired, QAASGMin, QAASGMax,
#####                           DEVAMIID, DEVASGDesired, DEVASGMin, DEVASGMax
#####
#####        From ImPorts need APPSGID, AZ1, AZ2, PrivateSubnet1, PrivateSubnet2, 
#####                           PRODIdP-TG, QAIdP-TG4443, DEVIdP-TG4444
##################################################################################################################
##################  RESOURCES      ###########################################################
##############################################################################################
Resources:
    ######################################################################################################
    ######################################################################################################
    #  PROD IdP LaunchConfiguration https (443)
    ShibbolethPRODIdPLaunchTemplate:
        Type: AWS::EC2::LaunchTemplate
        DeletionPolicy: 'Delete'
        Condition: CreateShibbolethPRODIdPResources
        Properties:
            #LaunchTemplateName is not required
            LaunchTemplateName:  !Join ['', [!Ref AppName, !Ref Environment,  "-PRODIdP-LaunchTemplate-", !Ref Region ]]
            LaunchTemplateData:
                BlockDeviceMappings:
                    - DeviceName: !Ref BlockDeviceName
                      Ebs:
                          Encrypted: true
                          KmsKeyId: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, EBSKEYIDVA ], !FindInMap [Environments, !Ref Environment, EBSKEYIDOH ] ]
                          VolumeSize: !Ref ShibbolethIdPEbsSize
                IamInstanceProfile:
                    Name: !FindInMap [Environments, !Ref Environment, EC2InstanceProfile]
                #XXXXXImageId:  !FindInMap [Environments, !Ref Environment, PRODAMIID]
                ImageId: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, PRODAMIIDVA ], !FindInMap [Environments, !Ref Environment, PRODAMIIDOH ] ]
                InstanceType: !FindInMap [Environments, !Ref Environment, EC2InstanceType]
                #KeyName: !Ref WHAMIKey
                SecurityGroupIds:
                    #  Apply Security Groups to the Launch Template
                    #######  ImportValue #######
                    - Fn::ImportValue: !Join ['', [!Ref AppName, !Ref Environment,  "-APPSGxID"] ]
                    - Fn::ImportValue: !Join ['', [!Ref AppName, !Ref Environment, "-STDBASESGxID"]]     
                    #######  MapValue #######
                    #- !FindInMap [Environments, !Ref Environment, STDBASESGxID]  

    #  ShibbolethIdP AutoScaling Group https (443)
    ShibbolethPRODIdPASG:
        Type: AWS::AutoScaling::AutoScalingGroup
        DeletionPolicy: 'Delete'
        Condition: CreateShibbolethPRODIdPResources
        Properties:
            AutoScalingGroupName: !Join ["", [!Ref AppName, !Ref Environment,  "-PRODIdP-ASG-", !Ref Region ]]
            AvailabilityZones:
                #######  ImportValue AZs ######
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-AZ1"]]
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment,  "-AZ2"]]
            VPCZoneIdentifier:
                #######  ImportValue Subnets #######
                #- Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PublicSubnet1"]]
                #- Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment,  "-PublicSubnet2"]]
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PrivateSubnet1"]]
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PrivateSubnet2"]]
            ######  LaunchTemplate to use  ######
            LaunchTemplate: 
                LaunchTemplateId: !Ref ShibbolethPRODIdPLaunchTemplate
                Version: !GetAtt ShibbolethPRODIdPLaunchTemplate.LatestVersionNumber
            TargetGroupARNs:
                #######  ImportValue TargetGroup #######
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PRODIdP-TG"] ]
            #DesiredCapacity: !FindInMap [Environments, !Ref Environment, PRODASGDesired]
            #MinSize: !FindInMap [Environments, !Ref Environment, PRODASGMin]
            DesiredCapacity: 0
            MinSize: 0
            #MaxSize: !FindInMap [Environments, !Ref Environment, PRODASGMax]
            MaxSize:  !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, PRODASGMaxVA ], !FindInMap [Environments, !Ref Environment, PRODASGMaxOH ] ]
            Cooldown: !Ref ShibbolethIdPCoolDownPeroid
            HealthCheckType: !Ref ShibbolethIdPHealthCheck
            HealthCheckGracePeriod: !Ref ShibbolethIdPHealthCheckWaitPeroid
            ServiceLinkedRoleARN:  !FindInMap [Environments, !Ref Environment, AutoScalingRoleArn]
            NotificationConfigurations:
                - TopicARN:
                      Ref: ShibbolethPRODIdPASGTopic
                  NotificationTypes:
                      - autoscaling:EC2_INSTANCE_LAUNCH
                      - autoscaling:EC2_INSTANCE_LAUNCH_ERROR
                      - autoscaling:EC2_INSTANCE_TERMINATE
                      - autoscaling:EC2_INSTANCE_TERMINATE_ERROR
            Tags:
                - Key: Name
                  Value:  !Join ["", [!Ref AppName, !Ref Environment,  "-PRODIdP-ASG"]]
                  PropagateAtLaunch: "true"
                - Key: SupportContactEmail
                  Value: !Ref SupportContactEmail
                  PropagateAtLaunch: "true"
                - Key: SupportGroup
                  Value: !Ref SupportGroup
                  PropagateAtLaunch: "true"
                - Key: srd:profile
                  Value: !Join ['', ['cimp:', !Ref AppName]]
                  PropagateAtLaunch: "true"
                - Key: EmorySpeedType1:SpeedTypePercent1
                  Value: !Join ['', [!Ref SPEEDTYPE, ':100']]  
                  PropagateAtLaunch: "true"
                - Key: EmoryApplicationName
                  Value: !Ref AppName
                  PropagateAtLaunch: "true"
                - Key: EmoryApplicationNameType
                  Value: !Ref AppName
                  PropagateAtLaunch: "true"

    #  ShibbolethIdP AutoScaling Policy https (443)
    ShibbolethPRODIdPCPUPolicy:
        Type: AWS::AutoScaling::ScalingPolicy
        DeletionPolicy: 'Delete'
        Condition: CreateShibbolethPRODIdPResources
        Properties:
            ##### AutoScalingGroup
            AutoScalingGroupName: !Ref ShibbolethPRODIdPASG
            PolicyType: TargetTrackingScaling
            TargetTrackingConfiguration:
                PredefinedMetricSpecification:
                    PredefinedMetricType: ASGAverageCPUUtilization
                TargetValue: !Ref ShibbolethIdPCpuTargetValue 
          
    #  Create SNS Topic ShibbolethIdPASG https (443)
    ShibbolethPRODIdPASGTopic:
      Type: AWS::SNS::Topic
      DeletionPolicy: 'Delete'
      Condition: CreateShibbolethPRODIdPResources
      Properties:
          Subscription:
              #- Endpoint: !Ref SNSEmail
              - Endpoint: !FindInMap [Environments, !Ref Environment, SNSEmail]
                Protocol: "email"
          TopicName: !Join ["", [!Ref AppName, !Ref Environment,  "_PROD_IdP_AutoScalingEvent_", !Ref Region]]
          
    ######################################################################################################
    ######################################################################################################
    #  QA IdP LaunchConfiguration https (4443)
    ShibbolethQAIdPLaunchTemplate4443:
        Type: AWS::EC2::LaunchTemplate
        DeletionPolicy: 'Delete'
        Condition: CreateShibbolethQAIdPResources4443
        Properties:
            #LaunchTemplateName is not required
            LaunchTemplateName:  !Join ['', [!Ref AppName, !Ref Environment,  "-QAIdP-LaunchTemplate4443-", !Ref Region ]]
            LaunchTemplateData:
                BlockDeviceMappings:
                    - DeviceName: !Ref BlockDeviceName
                      Ebs:
                          Encrypted: true
                          KmsKeyId: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, EBSKEYIDVA ], !FindInMap [Environments, !Ref Environment, EBSKEYIDOH ] ]
                          VolumeSize: !Ref ShibbolethIdPEbsSize
                IamInstanceProfile:
                    #Name: !Ref S3Role
                    Name:  !FindInMap [Environments, !Ref Environment, EC2InstanceProfile]
                #XXXXXImageId: !FindInMap [Environments, !Ref Environment, QAAMIID]
                ImageId: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, QAAMIIDVA ], !FindInMap [Environments, !Ref Environment, QAAMIIDOH ] ]
                InstanceType: !FindInMap [Environments, !Ref Environment, EC2InstanceType]
                #KeyName: !Ref WHAMIKey
                SecurityGroupIds:
                    #  Apply Security Groups to the Launch Template
                    #######  ImportValue #######
                    - Fn::ImportValue: !Join ['', [!Ref AppName, !Ref Environment,  "-APPSGxID"] ]
                    -  Fn::ImportValue: !Join ['', [!Ref AppName, !Ref Environment, "-STDBASESGxID"]]     
                    #######  MapValue #######
                    #- !FindInMap [Environments, !Ref Environment, STDBASESGxID]

    #  ShibbolethIdP AutoScaling Group https (4443)
    ShibbolethQAIdPASG4443:
        Type: AWS::AutoScaling::AutoScalingGroup
        DeletionPolicy: 'Delete'
        Condition: CreateShibbolethQAIdPResources4443
        Properties:
            AutoScalingGroupName: !Join ["", [!Ref AppName, !Ref Environment,  "-QAIdP-ASG4443-", !Ref Region ]]
            AvailabilityZones:
                #######  ImportValue AZs ######
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-AZ1"]]
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment,  "-AZ2"]]
            VPCZoneIdentifier:
                #######  ImportValue Subnets #######
                #- Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PublicSubnet1"]]
                #- Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment,  "-PublicSubnet2"]]
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PrivateSubnet1"]]
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-PrivateSubnet2"]]
            ######  LaunchTemplate to use  ######
            LaunchTemplate: 
                LaunchTemplateId: !Ref ShibbolethQAIdPLaunchTemplate4443
                Version: !GetAtt ShibbolethQAIdPLaunchTemplate4443.LatestVersionNumber
            TargetGroupARNs:
                #######  ImportValue TargetGroup #######
                - Fn::ImportValue: !Join ["", [!Ref AppName, !Ref Environment, "-QAIdP-TG4443"] ]
            #DesiredCapacity: !FindInMap [Environments, !Ref Environment, QAASGDesired]
            #MinSize: !FindInMap [Environments, !Ref Environment, QAASGMin]
            DesiredCapacity: 0
            #DesiredCapacity: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, QAASGDesiredVA ], !FindInMap [Environments, !Ref Environment, QAASGDesiredOH ] ]
            MinSize: 0
            #MinSize: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, QAASGMinVA ], !FindInMap [Environments, !Ref Environment, QAASGMinOH ] ]
            #MaxSize: !FindInMap [Environments, !Ref Environment, QAASGMax]
            MaxSize:  !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, QAASGMaxVA ], !FindInMap [Environments, !Ref Environment, QAASGMaxOH ] ]
            Cooldown: !Ref ShibbolethIdPCoolDownPeroid
            HealthCheckType: !Ref ShibbolethIdPHealthCheck
            HealthCheckGracePeriod: !Ref ShibbolethIdPHealthCheckWaitPeroid
            ServiceLinkedRoleARN:  !FindInMap [Environments, !Ref Environment, AutoScalingRoleArn]
            NotificationConfigurations:
                - TopicARN:
                      Ref: ShibbolethQAIdPASGTopic4443
                  NotificationTypes:
                      - autoscaling:EC2_INSTANCE_LAUNCH
                      - autoscaling:EC2_INSTANCE_LAUNCH_ERROR
                      - autoscaling:EC2_INSTANCE_TERMINATE
                      - autoscaling:EC2_INSTANCE_TERMINATE_ERROR
            Tags:
                - Key: Name
