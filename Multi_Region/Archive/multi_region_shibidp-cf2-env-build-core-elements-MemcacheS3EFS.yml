  #####  S3 Admin Bucket #######################################
  #####   a single S3 bucket environment shared by all 3 IdPs.
  S3Bucket1:
    Type: AWS::S3::Bucket
    Condition: CreateS31Resources
    DeletionPolicy: Delete
    Properties:
      #BucketName:  !Join ['', [ !FindInMap [Environments, !Ref Environment, AppNameLower], '-s3adminbucket1']]
      # like emory-wm-shibidp-dev-s3adminbucket1-va
      BucketName:  !Join ['', [ 'emory-wm-shibidp-', !FindInMap [Environments, !Ref Environment, EnvironmentLower], '-s3admin1-', !Ref LcRegion ]]
      AccessControl: Private
      BucketEncryption:
          ServerSideEncryptionConfiguration:
              - BucketKeyEnabled: true
                ServerSideEncryptionByDefault:
                    KMSMasterKeyID: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, S3KEYARNVA], !FindInMap [Environments, !Ref Environment, S3KEYARNOH] ]
                    #KMSMasterKeyID:  !FindInMap [Environments, !Ref Environment, S3KEYARN]
                    SSEAlgorithm: 'aws:kms'
      PublicAccessBlockConfiguration:
          BlockPublicAcls: TRUE
          BlockPublicPolicy: TRUE
          IgnorePublicAcls: TRUE
          RestrictPublicBuckets: TRUE
      VersioningConfiguration:
        Status: !Ref Versioning
      Tags:
        - Key: Name
          Value: !Join ['', [ 'emory-wm-shibidp-', !FindInMap [Environments, !Ref Environment, EnvironmentLower], '-s3admin1-', !Ref LcRegion ]]
        - Key: SupportContact
          Value: !Ref SupportContactEmail
        - Key: SupportGroup
          Value: !Ref SupportGroup
        - Key: Group
          Value:  !Ref Group
        - Key: srd:profile
          Value: !Join ['', ['cimp:', !Ref AppName]]
        - Key: EmorySpeedType1:SpeedTypePercent1
          Value: !Join ['', [!Ref SPEEDTYPE, ':100']] 
        - Key: EmoryApplicationName
          Value: !Ref AppName
        - Key: EmoryApplicationNameType
          Value: !Ref AppName


  #####  Elasticache memcache Resources #############################
  #####   a single memcahe per environment shared by all 3 IdPs.
  #  Memcache subnet group
  MemcachedSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Condition: CreateMemcacheResources
    Properties: 
      CacheSubnetGroupName:  !Join ['', [!Ref AppName, !Ref Environment, "-MemcachedSubnetGroup-", !Ref Region ]]
      Description:  !Join ['', [!Ref AppName, !Ref Environment, "-MemcachedSubnetGroup-", !Ref Region ]]
      SubnetIds: 
        - !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, PrivateSubnet1VA], !FindInMap [Environments, !Ref Environment, PrivateSubnet1OH] ]
        - !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, PrivateSubnet2VA], !FindInMap [Environments, !Ref Environment, PrivateSubnet2OH] ]
        #- !FindInMap [Environments, !Ref Environment, PrivateSubnet1]
        #- !FindInMap [Environments, !Ref Environment, PrivateSubnet2
        
  #  Create the CacheCluster
  MemcachedCluster:
    Type: 'AWS::ElastiCache::CacheCluster'
    Condition: CreateMemcacheResources
    Properties:
      AutoMinorVersionUpgrade: True
      AZMode: !Ref AzMode
      CacheNodeType: !Ref CacheNodeType
      CacheSubnetGroupName: !Ref MemcachedSubnetGroup
      ClusterName: !Join ['', [!Ref AppName, !Ref Environment, "-MemcachedCluster-", !Ref Region]]
      Engine: !Ref MemcacheEngine
      NotificationTopicArn: !Ref SNSTopic
      NumCacheNodes: !Ref NumberOfCacheNodes
      PreferredAvailabilityZones:
        #  The number of AZs must equal the number of cache nodes
        #- !FindInMap [Environments, !Ref Environment, AZ1]
        - !If [CreateVAResources, !FindInMap [Environments, !Ref Environment,  AZ1VA], !FindInMap [Environments, !Ref Environment,  AZ1OH] ]
      PreferredMaintenanceWindow: !Ref MaintWindow
      #SnapshotName: String
      VpcSecurityGroupIds: 
        - !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, MEMCACHESGxIDVA], !FindInMap [Environments, !Ref Environment, MEMCACHESGxIDOH] ]
        #- !FindInMap [Environments, !Ref Environment, MEMCACHESGxID]
        #- Fn::ImportValue:  !Join ['', [!Ref AppName, !Ref Environment, "-MemcacheSGID"]]
        #- !FindInMap [Environments, !Ref Environment, STDBASExSGID]
      Tags: 
        - Key: Name
          Value:  !Join ['', [!Ref AppName, !Ref Environment, "-MemcachedCluster-", !Ref Region ]]
        - Key: SupportContact
          Value: !Sub ${SupportContactEmail}
        - Key: SupportGroup
          Value: !Sub ${SupportGroup}
        - Key: Description
          Value:  !Join ['', [!Ref AppName, !Ref Environment, "-MemcachedCluster-",  !Ref Region ]]
        - Key: Group
          Value:  !Ref Group
        - Key: srd:profile
          Value: !Join ['', ['cimp:', !Ref AppName]]
        - Key: EmorySpeedType1:SpeedTypePercent1
          Value: !Join ['', [!Ref SPEEDTYPE, ':100']] 
        - Key: EmoryApplicationName
          Value: !Ref AppName
        - Key: EmoryApplicationNameType
          Value: !Ref AppName       


  #  Create SNS Topic for the MemcacheCache Cluster
  SNSTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: 'Delete'
    Condition: CreateMemcacheResources
    Properties:
      Subscription:
        - Endpoint: !Ref SNSEmail
          Protocol: "email"
      TopicName: !Join ['', [!Ref AppName, !Ref Environment, "-MemcachedCluster_Event-", !Ref Region]]
      

###############################################################################################################################
###############################################################################################################################
###############################################################################################################################
################  WARNING:                                                                                       ##############
################  Output Export Names MUST be unique per region and in our case per environment (PROD, QA, DEV)  ##############
###############################################################################################################################
Outputs:
  # (Regional Resources)
  #####  Export the EFS names
  ProdIdPEFSFileSystemId:
    Description: EFS filesystem ID.
    Condition: CreateShibbolethPRODIdPResources
    Value: !GetAtt [ProdIdPEFSFileSystem, FileSystemId]
    Export:
      Name:  !Join ['', [!Ref AppName, !Ref Environment, "-ProdIdPEFSFileSystemId"]]

  ProdIdPEFSFileSystemArn:
    Description: EFS filesystem Arn.
    Condition: CreateShibbolethPRODIdPResources
    Value: !GetAtt [ProdIdPEFSFileSystem, Arn]
    Export:
      Name:  !Join ['', [!Ref AppName, !Ref Environment, "-ProdIdPEFSFileSystemArn"]]

  QaIdPEFSFileSystemId:
    Description: EFS filesystem ID.
    Condition: CreateShibbolethQAIdPResources4443
    Value: !GetAtt [QaIdPEFSFileSystem, FileSystemId]
    Export:
      Name:  !Join ['', [!Ref AppName, !Ref Environment, "-QaIdPEFSFileSystemId"]]

  QaIdPEFSFileSystemArn:
    Description: EFS filesystem Arn.
    Condition: CreateShibbolethQAIdPResources4443
    Value: !GetAtt [QaIdPEFSFileSystem, Arn]
    Export:
      Name:  !Join ['', [!Ref AppName, !Ref Environment, "-QaIdPEFSFileSystemArn"]]

  DevIdPEFSFileSystemId:
    Description: EFS filesystem ID.
    Condition: CreateShibbolethDEVIdPResources4444
    Value: !GetAtt [DevIdPEFSFileSystem, FileSystemId]
    Export:
      Name:  !Join ['', [!Ref AppName, !Ref Environment, "-DevIdPEFSFileSystemId"]]

  DevIdPEFSFileSystemArn:
    Description: EFS filesystem Arn.
    Condition: CreateShibbolethDEVIdPResources4444
    Value: !GetAtt [DevIdPEFSFileSystem, Arn]
    Export:
      Name:  !Join ['', [!Ref AppName, !Ref Environment, "-DevIdPEFSFileSystemArn"]]

  #####  Export the S3 Bucket name.
  S3Bucket1Arn:
    Condition: CreateS31Resources
    Value: !GetAtt [S3Bucket1, Arn]
    Description: Origin bucket Arn.
    Export:
      Name:  !Join ['', [!Ref AppName, !Ref Environment, "-S3Bucket1Arn"]]

  S3Bucket1Name:
    Condition: CreateS31Resources
    Value: !Ref S3Bucket1
    Description: S3 bucket domain name.
    Export:
      Name: !Join ['', [!Ref AppName, !Ref Environment, "-S3Bucket1Name"]]

  S3Bucket1WebsiteURL:
    Condition: CreateS31Resources
    Value: !GetAtt [S3Bucket1, WebsiteURL]
    Description: URL for the S3 website origin bucket.
    Export:
      Name: !Join ['', [!Ref AppName, !Ref Environment, "-S3Bucket1WebsiteURL"]]

  #####  Export the memcache cluster name.
  MemcachedCluster:
    Description: Name of the memcache cluster.
    Value: !Ref MemcachedCluster
    Export:
      Name: !Join ['', [!Ref AppName, !Ref Environment, "-MemcachedCluster"]]

  #####  Export the cert arn.
  LoginEmoryEduCertArn:
    Description: ID of the ALB SGx.
    #Value: !FindInMap [Environments, !Ref Environment, LoginEmoryEduCertArn]
    Value: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, LoginEmoryEduCertArnVA], !FindInMap [Environments, !Ref Environment, LoginEmoryEduCertArnOH] ]
    Export:
      Name: !Join ['', [!Ref AppName, !Ref Environment, "-LoginEmoryEduCertArn"]]

