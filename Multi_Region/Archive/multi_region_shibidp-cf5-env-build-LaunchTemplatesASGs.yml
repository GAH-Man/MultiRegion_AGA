                  PropagateAtLaunch: "true"
                - Key: EmoryApplicationName
                  Value: !Ref AppName
                  PropagateAtLaunch: "true"
                - Key: EmoryApplicationNameType
                  Value: !Ref AppName
                  PropagateAtLaunch: "true"


    #  ShibbolethIdP 4443 AutoScaling Policy
    ShibbolethQAIdPCPUPolicy4443:
        Type: AWS::AutoScaling::ScalingPolicy
        DeletionPolicy: 'Delete'
        Condition: CreateShibbolethQAIdPResources4443
        Properties:
            ##### AutoScalingGroup
            AutoScalingGroupName: !Ref ShibbolethQAIdPASG4443
            PolicyType: TargetTrackingScaling
            TargetTrackingConfiguration:
                PredefinedMetricSpecification:
                    PredefinedMetricType: ASGAverageCPUUtilization
                TargetValue: !Ref ShibbolethIdPCpuTargetValue      

    #  Create SNS Topic ShibbolethIdPASG 4443
    ShibbolethQAIdPASGTopic4443:
      Type: AWS::SNS::Topic
      DeletionPolicy: 'Delete'
      Condition: CreateShibbolethQAIdPResources4443
      Properties:
