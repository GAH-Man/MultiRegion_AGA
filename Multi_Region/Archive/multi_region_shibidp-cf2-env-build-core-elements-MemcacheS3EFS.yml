Resources:
  #####  EFS Resources  ###############################################################################
  #####   a different EFS for each IdP in each environment. 
  ##### PROD IdP EFS  #########################################
  ProdIdPEFSFileSystem:
    Type: AWS::EFS::FileSystem
    Condition: CreateShibbolethPRODIdPResources
    Properties:
      BackupPolicy:
        Status: ENABLED
      Encrypted: true
      #KmsKeyId: !Ref KmsKey
      #KmsKeyId: !FindInMap [Environments, !Ref Environment, EFSKEYALIAS]
      #KmsKeyId: !FindInMap [Environments, !Ref Environment, EFSKEYID]
      KmsKeyId: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, EFSKEYIDVA], !FindInMap [Environments, !Ref Environment, EFSKEYIDOH] ]
      LifecyclePolicies:
        - TransitionToIA: !Ref MoveToIADays
      PerformanceMode: !Ref Performance
      #ProvisionedThroughputInMibps: !Ref ProvisionedThroughput
      ThroughputMode: !Ref Throughput
      FileSystemTags:
        - Key: Name
          Value: !Join ['', [!Ref AppName, !Ref Environment, "-ProdIdPEFS-", !Ref Region ]]
        - Key: SupportContact
          Value: !Sub ${SupportContactEmail}
        - Key: SupportGroup
          Value: !Sub ${SupportGroup}
        - Key: Group
          Value:  !Ref Group
        - Key: srd:profile
          Value: !Join ['', ['cimp:', !Ref AppName]]
        - Key: EmorySpeedType1:SpeedTypePercent1
          Value: !Join ['', [!Ref SPEEDTYPE, ':100']] 
        - Key: EmoryApplicationName
          Value: !Ref AppName
        - Key: EmoryApplicationNameType
          Value: !Ref AppName

  ProdIdPEFSMountTargetPublicSubnet1:
    Type: AWS::EFS::MountTarget
    Condition: CreateShibbolethPRODIdPResources
    Properties:
      FileSystemId:
          !Ref ProdIdPEFSFileSystem
      SecurityGroups:
        - !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, EFSSGxIDVA], !FindInMap [Environments, !Ref Environment, EFSSGxIDOH] ]
        #- !FindInMap [Environments, !Ref Environment, EFSSGxID]
        #- Fn::ImportValue: !Join ['', [!Ref AppName, !Ref Environment, "-EFSSG"]]
        #- !FindInMap [Environments, !Ref Environment, STDBASExSGID]
      #SubnetId:  !FindInMap [Environments, !Ref Environment, PublicSubnet1]
      SubnetId: !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, PublicSubnet1VA], !FindInMap [Environments, !Ref Environment, PublicSubnet1OH] ]

  ProdIdPEFSMountTargetPublicSubnet2:
    Type: AWS::EFS::MountTarget
    Condition: CreateShibbolethPRODIdPResources
    Properties:
      FileSystemId:
          !Ref ProdIdPEFSFileSystem
      SecurityGroups:
        - !If [CreateVAResources, !FindInMap [Environments, !Ref Environment, EFSSGxIDVA], !FindInMap [Environments, !Ref Environment, EFSSGxIDOH] ]
        #- !FindInMap [Environments, !Ref Environment, EFSSGxID]
