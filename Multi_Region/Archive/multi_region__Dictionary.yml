---
AWSTemplateFormatVersion: '2010-09-09'
Description:
  This template will create the EFS (one each for DEV, QA, and PROD IdPs), Elasticache memcache (single), and S3 Bucket (single).
  By selecting either DEV, QA, or PROD for the Environment parameter, the template will build the selected environment.
  Additionally, the EFS, the Memcache, and S3 Bucket names are exported.
Parameters:
  AppName: 
    Description: The application name.
    Type: String
    Default: WebMgmtShibIdP
    AllowedValues:
      - WebMgmtShibIdP

  Environment:
    Description: Environment. Determines which environment and resources will be built.
    Type: String
    Default: DEV
    AllowedValues:
      - PROD
      - QA
      - DEV
    ConstraintDescription: Must specify PROD, QA, or Dev, DEV.

  EncryptAlgorithm:
    Type: String
    Default: 'aws:kms'
    Description: Encrypt algorithm for S3 Bucket.  Use aws:kms. Allowed values AES256 | aws:kms | aws:kms:dsse. 
    AllowedValues:
      - 'aws:kms'

  Performance:
    Type: String
    Default: 'generalPurpose'
    AllowedValues:
      - generalPurpose
      - maxIO
    Description: Performance mode of EFS.

  ProvisionedThroughput:
    Type: Number
    Default: 1024
    Description: Valid values are 1-1024.

  RequiredTagKey:
    Type: String
    Default: 'EmoryApplicationName'
    Description: Requied tag key.

  RequiredTagValuePrepend:
    Type: String
    Default: 'WebMgmt'
    Description: Requied tag prepend.

  PublicSubnet1:
    Type: String
    Default: subnet-ed7dddc0
    Description: Public subnet1.

  PublicSubnet2:
    Type: String
    Default: subnet-05b2214c
    Description: Public subnet2.

  Region:
    Description: Region- Change to VA or OH.
    Default: 'VA'
    Type: String
    AllowedValues:
      - 'VA'
      - 'OH'
    ConstraintDescription: AWS Region - Change to VA or OH.

  LcRegion:
    Description: Region- Change to VA or OH.
    Default: 'va'
    Type: String
    AllowedValues:
      - 'va'
      - 'oh'
    ConstraintDescription: AWS Region - Change to VA or OH.

  SNSEmail:
    Type: String
    Default: 'ghall4@emory.edu'
    AllowedValues:
      - 'ghall4@emory.edu'
      - 'webgroup@emory.edu'
    Description: Support contact email.

  SupportContactEmail:
    Type: String
    Default: 'webgroup@emory.edu'
    Description: Support contact email.

  SupportGroup:
    Type: String
    Default: 'Emory University WebManagement'
    Description: Support Group for this service.

  ##############################################################################
  #####  Required Tags  ########################################################
  ##############################################################################
  EmoryApplicationName:
    Type: String
    Default: 'WebMgmtShibIdP'
    Description: The application/service name.

  Group:
    Type: String
    Default: OIT-WebMgmt
    Description: Tag used for individual group lifecycle management policies.

  srdProfile:
    Type: String
    Default: 'cimp:WebMgmtShibIdP'
    Description: Tag used for auto-tagging/SRD/SRR in ECS.

  SPEEDTYPE:
    Type: String
    Default: "1233430000"
    Description: Emory SpeedType - should be set by Jenkins
  #################################################################################################
  ###############################  EFS Specific Parameters ########################################
  #################################################################################################
  CreateProdIdPEFS:
    Type: String
    Default: yes
    AllowedValues:
        - yes
        - no
    Description: Determines if ProdIdPEFS gets created.

  CreateQaIdPEFS:
    Type: String
    Default: yes
    AllowedValues:
        - yes
        - no
    Description: Determines if QaIdPEFS gets created.

  CreateDevIdPEFS:
    Type: String
    Default: yes
    AllowedValues:
        - yes
        - no
    Description: Determines if DevIdPEFS gets created.

  CreateShibbolethPRODIdPEnvironment:
    Type: String
    Default: 'yes'
    AllowedValues:
      - 'yes'
      - 'no'
    Description: Determines whether to create the Coldfusion resources.

  CreateShibbolethQAIdPEnvironment4443:
    Type: String
    Default: 'yes'
    AllowedValues:
      - 'yes'
      - 'no'
    Description: Determines whether to create the Coldfusion resources.

  CreateShibbolethDEVIdPEnvironment4444:
    Type: String
    Default: 'yes'
    AllowedValues:
      - 'yes'
      - 'no'
    Description: Determines whether to create the Coldfusion resources.

  EFSSG:
    Type: String
    Default: sg-096c6fe0b38cef73e
    Description: EFS EC2 security group.

  MoveToIADays:
    Type: String
    Default: AFTER_90_DAYS
    AllowedValues:
      - AFTER_7_DAYS
      - AFTER_14_DAYS
      - AFTER_30_DAYS
      - AFTER_60_DAYS
      - AFTER_90_DAYS
    Description: Days before moving to Infrequent Access (IA) storage class.

  Throughput:
    Type: String
    Default: bursting
    AllowedValues:
      - bursting
      - provisioned
    Description: Support Group for this service.
  #################################################################################################
  ###############################  S3 Bucket Specific Parameters ##################################
  #################################################################################################
  CreateS31:
    Type: String
    Default: yes
    AllowedValues:
        - yes
        - no
    Description: Determines if S3 bucket gets created.

  CurrCopyExpirationDays:
    Description: Expiration in days.
    Type: String
    Default: 180
    ConstraintDescription: The number of days to keep a current copy of an object.

  EncryptAlgorithm:
    Type: String
    Default: AES256

  NoncurrentCopyExpirationDays:
    Description: Noncurrent expiration in days.
    Type: String
    Default: 180
    ConstraintDescription: Must be a number that represents the number of days to keep a noncurrent copy of an object.

  Versioning:
    Type: String
    Default: 'Enabled'
    AllowedValues:
      - Enabled
      - Suspended
    Description: Allowed values, Enabled | Suspended.

  #################################################################################################
  ###############################  memcached Specific Parameters ##################################
  #################################################################################################
  AzMode:
    Description: Application name.
    Type: String
    Default: single-az
    AllowedValues:
      - single-az
      - cross-az 
    ConstraintDescription: Must specify single-az or cross-az.
    
  CacheNodeType:
    Description: The compute and memory capacity of the nodes in the Cache Cluster
    Type: String
    Default: cache.t2.small
    AllowedValues:
      - cache.m1.small
      - cache.m1.large
      - cache.m1.xlarge
      - cache.m2.xlarge
      - cache.c1.xlarge
      - cache.t2.micro
      - cache.t2.small
      - cache.t2.medium
      - cache.m3.medium
      - cache.m3.large
      - cache.m3.xlarge
      - cache.r3.large
      - cache.r3.xlarge
    ConstraintDescription: must select a valid Cache Node type.

  CreateMemcache:
    Type: String
    Default: yes
    AllowedValues:
        - yes
        - no
    Description: Determines memcache gets created.
       
  MaintWindow:
    Description: Weekly maintenance window.
    Type: String
    Default: mon:01:00-mon:02:00
    AllowedValues:
      - mon:01:00-mon:02:00
    ConstraintDescription: Must specify application name.
    
  MemcacheEngine:
    Type: String
    Default: memcached
    AllowedValues:
      - memcached
      #- redis
    Description: ElastiCache engine type. 
 
  NumberOfCacheNodes:
    Default: '1'
    Description: The number of Cache Nodes the Cache Cluster should have.
    Type: Number
    MinValue: '1'
    MaxValue: '2'
    ConstraintDescription: must be between 1 and 2.   
 
  #######################################################################################################
  ################  Conditions and Mappings  ############################################################
  #######################################################################################################
  ##### MASTER COPY
  ##### REM: Parameter names must be same in all 3 Environment Maps.
  ##### REM:  Only SGx security groups in QA and PROD Environments.
  #https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/mappings-section-structure.html
  
Conditions:
    #  Conditionally determines whether to build the associated resources.
    CreateProdIdPEFSResources: !Equals [ !Ref CreateProdIdPEFS, yes ]
    CreateQaIdPEFSResources: !Equals [ !Ref CreateQaIdPEFS, yes ]
    CreateDevIdPEFSResources: !Equals [ !Ref CreateDevIdPEFS, yes ]

    CreateMemcacheResources: !Equals [ !Ref CreateMemcache, yes ]
    CreateS31Resources: !Equals [ !Ref CreateS31, yes ]

    CreateShibbolethPRODIdPResources: !Equals [ !Ref CreateShibbolethPRODIdPEnvironment, 'yes' ]
    CreateShibbolethQAIdPResources4443: !Equals [ !Ref CreateShibbolethQAIdPEnvironment4443, 'yes' ]
    CreateShibbolethDEVIdPResources4444: !Equals [ !Ref CreateShibbolethDEVIdPEnvironment4444, 'yes' ]

    CreateVAResources: !Equals [ !Ref Region, 'VA' ]
    CreateOHResources: !Equals [ !Ref Region, 'OH']


